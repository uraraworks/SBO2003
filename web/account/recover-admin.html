<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>アカウント復旧の承認</title>
<!--
	アカウント復旧の申請（キャラ名＋アカウント名かパスワードの一部、どちらか片方だけ合ったもの）を
	管理者が確かめて承認・却下するページ。サーバーの INI にある管理者アカウントでログインする。
	API は server/node/sbosvr_account.js の /api/admin/*。
-->
<style>
	:root {
		--bg: #1d1f24;
		--fg: #e8e8e8;
		--sub: #9aa0a6;
		--panel: #262a33;
		--border: #3a404a;
		--accent: #f0b84a;
		--ok: #7fd17f;
		--ng: #ff9b8a;
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 14px/1.6 "BIZ UDGothic", "Hiragino Sans", "Meiryo", sans-serif;
	}
	main {
		max-width: 880px;
		margin: 0 auto;
		padding: 16px;
	}
	h1 {
		font-size: 18px;
		color: var(--accent);
	}
	.card {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 14px 16px;
		margin-bottom: 12px;
	}
	label {
		display: block;
		margin: 8px 0 4px;
	}
	input {
		width: 100%;
		max-width: 280px;
		box-sizing: border-box;
		background: #0f1217;
		border: 1px solid var(--border);
		border-radius: 6px;
		color: var(--fg);
		font: 16px/1.3 inherit;
		padding: 8px;
	}
	button {
		background: var(--accent);
		color: #1d1f24;
		border: none;
		border-radius: 6px;
		font: bold 14px/1 "BIZ UDGothic", "Hiragino Sans", "Meiryo", sans-serif;
		padding: 9px 14px;
		margin: 10px 8px 0 0;
		cursor: pointer;
	}
	button.sub {
		background: transparent;
		color: var(--fg);
		border: 1px solid var(--border);
	}
	.msg {
		color: var(--ng);
		min-height: 1.4em;
	}
	.head {
		display: flex;
		flex-wrap: wrap;
		gap: 4px 16px;
		align-items: baseline;
	}
	.name {
		font-size: 16px;
		font-weight: bold;
	}
	.sub-text {
		color: var(--sub);
		font-size: 13px;
	}
	.tag {
		display: inline-block;
		border-radius: 4px;
		padding: 0 6px;
		font-size: 12px;
		border: 1px solid var(--border);
	}
	.tag.pending { color: var(--accent); border-color: var(--accent); }
	.tag.approved, .tag.delivered { color: var(--ok); border-color: var(--ok); }
	.tag.rejected { color: var(--ng); border-color: var(--ng); }
	.message {
		white-space: pre-wrap;
		word-break: break-all;
		background: #0f1217;
		border-radius: 6px;
		padding: 6px 8px;
		margin-top: 6px;
	}
	[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
	<h1>アカウント復旧の承認</h1>

	<div class="card" id="login">
		<p class="sub-text">サーバーの管理者アカウントでログインしてください。</p>
		<label for="acc">管理者アカウント</label>
		<input id="acc" type="text" autocomplete="username" autocapitalize="off">
		<label for="pas">パスワード</label>
		<input id="pas" type="password" autocomplete="current-password">
		<div><button type="button" id="login-btn">ログイン</button></div>
		<div class="msg" id="login-msg"></div>
	</div>

	<div id="list-area" hidden>
		<p class="sub-text">
			キャラ名に加えて、アカウント名かパスワードの一部の「どちらか片方だけ」が合った申請です。
			当時の様子（レベル・作成日・プレイ時間）やひとことを見て、本人らしければ承認してください。
			承認すると、申請した端末でボタンを押すだけでログインできるようになります。
		</p>
		<button type="button" class="sub" id="reload">読み直す</button>
		<label style="display:inline"><input type="checkbox" id="show-all" style="width:auto"> 処理済みも出す</label>
		<div class="msg" id="list-msg"></div>
		<div id="list"></div>
	</div>
</main>
<script>
(function () {
	var session = '';
	var aRequests = [];

	function $(id) {
		return document.getElementById(id);
	}
	function api(url, body) {
		return fetch(url, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(body)
		}).then(function (res) {
			return res.json().catch(function () { return {}; }).then(function (data) {
				data.httpStatus = res.status;
				return data;
			});
		});
	}
	function el(tag, cls, text) {
		var e = document.createElement(tag);
		if (cls) {
			e.className = cls;
		}
		if (text != null) {
			e.textContent = text;
		}
		return e;
	}

	var STATUS = { pending: '承認待ち', approved: '承認済み（受け取り待ち）', delivered: '承認済み', rejected: '却下' };

	function render() {
		var list = $('list');
		var bAll = $('show-all').checked;
		list.textContent = '';
		var a = aRequests.filter(function (r) { return bAll || r.status === 'pending'; });
		if (!a.length) {
			list.appendChild(el('p', 'sub-text', bAll ? '申請はありません。' : '承認待ちの申請はありません。'));
			return;
		}
		a.forEach(function (r) {
			var card = el('div', 'card');
			var head = el('div', 'head');
			head.appendChild(el('span', 'name', r.name || '（名前なし）'));
			head.appendChild(el('span', 'tag ' + r.status, STATUS[r.status] || r.status));
			head.appendChild(el('span', 'sub-text', new Date(r.created).toLocaleString('ja-JP')));
			card.appendChild(head);
			card.appendChild(el('div', 'sub-text',
				'アカウント: ' + r.account + ' ／ Lv ' + r.level + ' ／ 作成 ' + r.made +
				' ／ プレイ ' + Math.floor(r.playMinutes / 60) + '時間 ／ ログイン ' + r.loginCount + '回'));
			card.appendChild(el('div', 'sub-text',
				'合っていたもの: ' + (r.byAccount ? 'アカウント名' : 'パスワードの一部') + ' ／ IP ' + r.ip));
			if (r.message) {
				card.appendChild(el('div', 'message', r.message));
			}
			if (r.status === 'pending') {
				var ok = el('button', '', '承認する');
				var ng = el('button', 'sub', '却下する');
				ok.addEventListener('click', function () { decide(r, true); });
				ng.addEventListener('click', function () { decide(r, false); });
				card.appendChild(ok);
				card.appendChild(ng);
			}
			list.appendChild(card);
		});
	}

	function load() {
		api('/api/admin/recover/list', { session: session }).then(function (data) {
			if (data.httpStatus === 401) {
				$('list-area').hidden = true;
				$('login').hidden = false;
				$('login-msg').textContent = 'もう一度ログインしてください。';
				return;
			}
			$('list-msg').textContent = '';
			aRequests = data.requests || [];
			render();
		}).catch(function () {
			$('list-msg').textContent = 'サーバーにつながりませんでした。';
		});
	}

	function decide(r, bApprove) {
		var text = bApprove ? '「' + (r.name || r.account) + '」の復旧を承認しますか？' : '「' + (r.name || r.account) + '」の申請を却下しますか？';
		if (!window.confirm(text)) {
			return;
		}
		api('/api/admin/recover/decide', { session: session, id: r.id, approve: bApprove }).then(function (data) {
			if (!data.ok) {
				$('list-msg').textContent = '処理できませんでした（' + (data.error || data.httpStatus) + '）';
			}
			load();
		});
	}

	function login() {
		$('login-msg').textContent = '';
		api('/api/admin/login', { account: $('acc').value, password: $('pas').value }).then(function (data) {
			if (!data.session) {
				$('login-msg').textContent = data.error === 'too_many' ?
					'何度も間違えたので、しばらく時間をおいてください。' : 'アカウントかパスワードが違います。';
				return;
			}
			session = data.session;
			$('pas').value = '';
			$('login').hidden = true;
			$('list-area').hidden = false;
			load();
		}).catch(function () {
			$('login-msg').textContent = 'サーバーにつながりませんでした。';
		});
	}

	$('login-btn').addEventListener('click', login);
	$('pas').addEventListener('keydown', function (ev) {
		if (ev.key === 'Enter') {
			login();
		}
	});
	$('reload').addEventListener('click', load);
	$('show-all').addEventListener('change', render);
})();
</script>
</body>
</html>
