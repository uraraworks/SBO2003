# Sbo2003 本番（SBOP2 と同じ Windows Server の VPS）用の配布 zip を作る
#
# SBOP2 の windows-publish.yml と同じく、zip を作って成果物に保存するところまで。
# VPS への展開は手で行う（手順は deploy/production/README.md）。
#
#   1) ステージングと同じ deploy/staging/Dockerfile のビルド段（emsdk）でサーバーとブラウザ版をビルドし、
#      deploy/production/make-zip.sh で zip にする（Windows 用の Node.js を同梱）。
#   2) Windows のランナーで zip を展開して start.ps1 で起動し、/health とページを確かめてから
#      stop.ps1 でデータを保存して止まることを確かめる。
#
#   3) 手動実行で「VPS へデプロイする」にチェックがある時は、SSH で VPS へ送って入れ替える
#      （deploy/production/vps-deploy.sh → VPS で remote-deploy.ps1。stop.ps1 で保存して止めてから展開して起動）。
#
# 手動実行・v* タグ・関係するファイルを変える PR の時だけ動く（VPS へのデプロイは手動実行の時だけ）。
# BGM の MIDI は Secret SBO2003_PRIVATE_TOKEN（SBO2003-private を読めるトークン）で取ってくる。無ければ BGM 無し。
#
# VPS へのデプロイに必要な設定（Settings → Secrets and variables → Actions）:
#   変数 SBO2003_VPS_HOST          VPS のホスト名か IP（未設定の間はデプロイしない）
#   変数 SBO2003_VPS_USER          SSH ユーザー（Administrators に入っていること）
#   変数 SBO2003_VPS_PORT          SSH のポート（未設定なら 22）
#   Secret SBO2003_VPS_SSH_KEY     上のユーザーでログインできる SSH 秘密鍵（そのままか base64 の1行）
#   Secret SBO2003_VPS_KNOWN_HOSTS ssh-keyscan -p <ポート> <ホスト> の出力（なりすまし防止）
#   変数 SBO2003_VPS_HEALTH_URL    外から確かめる URL（任意。例 https://sbo2003.urara-works.jp/health）

name: production-publish

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: VPS へデプロイする（外すと zip を作って確かめるだけ）
        type: boolean
        default: true
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/production-publish.yml
      - deploy/production/**
      - server/node/**

permissions:
  contents: read

concurrency:
  group: production-publish-${{ github.ref }}
  # デプロイの途中で止めないよう、手動実行は取り消さない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v6

      - name: 非公開の素材（MIDI）を取ってくる
        env:
          SBO2003_PRIVATE_TOKEN: ${{ secrets.SBO2003_PRIVATE_TOKEN }}
        run: tools/public/fetch-private-assets.sh

      - name: サーバーとブラウザ版をビルド
        run: |
          # ステージングのイメージと同じビルド段を使い、出来たものだけ取り出す
          docker build --target build -f deploy/staging/Dockerfile -t sbo2003-build .
          id=$(docker create sbo2003-build)
          mkdir -p out/server-release out/web/dist
          docker cp "$id:/src/out/server-release/." out/server-release/
          docker cp "$id:/src/out/web/dist/." out/web/dist/
          docker rm "$id"

      - name: zip を作る
        id: zip
        run: |
          deploy/production/make-zip.sh out/server-release out/web/dist publish
          zip=$(ls publish/Sbo2003_Server_*.zip | head -n 1)
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: zip を成果物として保存
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.name }}
          path: dl

      - name: 展開して起動する
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dl -Filter 'Sbo2003_Server_*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath C:\sbo2003-test
          Set-Content -Path C:\sbo2003-test\sbo2003.env -Encoding UTF8 -Value @(
            'SBO2003_ADMIN_PASSWORD=ci-test-pass',
            'SBO2003_HTTP_PORT=18090'
          )
          # 確かめる側は pwsh（BOM なしの UTF-8 を読める）。start.ps1・stop.ps1 は VPS と同じく
          # Windows PowerShell 5.1（powershell.exe）で動かす（BOM 付き UTF-8 の .ps1 が読めることも確かめる）
          $w = Start-Process powershell.exe -PassThru -WindowStyle Hidden `
            -ArgumentList '-NoProfile -ExecutionPolicy Bypass -File C:\sbo2003-test\start.ps1'
          Set-Content -Path C:\sbo2003-test\wrapper.pid -Value $w.Id

      - name: 動いていることを確かめる
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try {
              $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18090/health).Content -match 'ok'
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw '/health に応答がありません' }
          $page = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18090/).Content
          if ($page -notmatch 'SBO_DEFAULT_WS') { throw 'ブラウザ版のページが配られていません' }
          if (-not (Test-Path C:\sbo2003-test\data\SBODATA)) { throw 'data\SBODATA が作られていません' }
          $ini = Get-Content C:\sbo2003-test\data\SboSvr.ini -Raw
          if ($ini -notmatch 'Password=ci-test-pass') { throw '管理者パスワードが設定されていません' }
          Write-Host '起動を確認しました'

      - name: stop.ps1 で保存して止まることを確かめる
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\sbo2003-test\stop.ps1 -TimeoutSec 60
          if ($LASTEXITCODE -ne 0) { throw "stop.ps1 が失敗しました（$LASTEXITCODE）" }
          $w = Get-Process -Id ([int](Get-Content C:\sbo2003-test\wrapper.pid)) -ErrorAction SilentlyContinue
          if ($w -and -not $w.WaitForExit(30000)) { throw 'start.ps1 が終わりません（起動し直してしまった？）' }
          $out = Get-ChildItem C:\sbo2003-test\log -Filter 'sbosvr-*.out.log' | Get-Content -Raw -Encoding UTF8
          if ($out -notmatch '停止ファイル') { throw '停止ファイルで止まっていません' }
          if ($out -notmatch '終了しました') { throw 'サーバーが保存して終わっていません' }
          if (Get-NetTCPConnection -LocalPort 18090 -State Listen -ErrorAction SilentlyContinue) { throw 'まだ待ち受けています' }
          Write-Host '保存して止まることを確認しました'

      - name: remote-deploy.ps1 で入れ替え・戻し・データの入れ替えを確かめる
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # VPS と同じく Windows PowerShell 5.1 で動かす。zip に入っている（BOM 付き UTF-8・CRLF の）ものを使う
          $root = 'C:\sbo2003-deploy'
          New-Item -ItemType Directory -Force -Path "$root\upload" | Out-Null
          Copy-Item C:\sbo2003-test\remote-deploy.ps1 "$root\upload\"
          $zip = Get-ChildItem dl -Filter 'Sbo2003_Server_*.zip' | Select-Object -First 1
          function Run([string[]]$a) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\upload\remote-deploy.ps1" -Root $root @a
            if ($LASTEXITCODE -ne 0) { throw "remote-deploy.ps1 $a が失敗しました（$LASTEXITCODE）" }
          }
          Write-Host '----- 初回（タスク登録・sbo2003.env 作成・起動）'
          Copy-Item $zip.FullName "$root\upload\"
          Run @('-Zip', "$root\upload\$($zip.Name)")
          Write-Host '----- 2 回目（保存して止めて、prev\ に退避して入れ替え）'
          Copy-Item $zip.FullName "$root\upload\"
          Run @('-Zip', "$root\upload\$($zip.Name)")
          if (-not (Test-Path "$root\prev\server\SboSvr.js")) { throw 'prev\ に前の版がありません' }
          Write-Host '----- 1 つ前の版に戻す'
          Run @('-Rollback')
          Write-Host '----- データの入れ替え（前の確認で作ったデータを持ってくる）'
          tar.exe -czf "$root\upload\data.tgz" -C C:\sbo2003-test\data SBODATA SboSvr.ini
          if ($LASTEXITCODE -ne 0) { throw 'tgz を作れません' }
          Run @('-Data', "$root\upload\data.tgz")
          if (-not (Get-ChildItem "$root\backup" -Filter 'sbo2003-data-*.zip')) { throw '入れ替え前のデータが控えられていません' }
          $ini = Get-Content "$root\data\SboSvr.ini" -Raw
          if ($ini -notmatch 'Password=ci-test-pass') { throw '持ってきた SboSvr.ini になっていません' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\stop.ps1" -TimeoutSec 60
          if ($LASTEXITCODE -ne 0) { throw "stop.ps1 が失敗しました（$LASTEXITCODE）" }
          Write-Host '入れ替え・戻し・データの入れ替えを確認しました'

      - name: ログを表示
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem C:\sbo2003-test\log, C:\sbo2003-deploy\log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name)"
            Get-Content $_.FullName -Encoding UTF8
          }

  deploy:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.name }}
          path: dl

      - name: 設定を確かめる
        id: check
        env:
          VPS_HOST: ${{ vars.SBO2003_VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice::変数 SBO2003_VPS_HOST が未設定なので、VPS へのデプロイはしません"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH の準備
        if: steps.check.outputs.skip != '1'
        env:
          SSH_KEY: ${{ secrets.SBO2003_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SBO2003_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # 秘密鍵はそのままの形でも、base64 で1行にした形でもよい。CR と行末の空白は取り除く。
          key=$(printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//')
          case "$key" in
            -----BEGIN*) printf '%s\n' "$key" > ~/.ssh/id_vps ;;
            *) printf '%s' "$key" | tr -d ' \n' | base64 -d > ~/.ssh/id_vps ;;
          esac
          chmod 600 ~/.ssh/id_vps
          ssh-keygen -y -f ~/.ssh/id_vps > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: VPS へ送って入れ替える
        if: steps.check.outputs.skip != '1'
        env:
          VPS_HOST: ${{ vars.SBO2003_VPS_HOST }}
          VPS_USER: ${{ vars.SBO2003_VPS_USER }}
          VPS_PORT: ${{ vars.SBO2003_VPS_PORT || '22' }}
          SSH_KEY: ~/.ssh/id_vps
          HEALTH_URL: ${{ vars.SBO2003_VPS_HEALTH_URL }}
        run: deploy/production/vps-deploy.sh "$(ls dl/Sbo2003_Server_*.zip | head -n 1)"
